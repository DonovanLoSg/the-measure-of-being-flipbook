<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Measure of Being | Read a Preview</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f5f3ef;color:#252525;font-family:Georgia,'Times New Roman',serif}
    .header{text-align:center;padding:18px 12px 12px}
    .header h1{font-size:clamp(23px,4vw,35px);font-weight:400;margin:0 0 6px}
    .header p{margin:0;color:#69635e;font-size:14px}
    #flipbook{height:min(76vh,780px);min-height:400px;width:100%;background:#eae7e2}
    .footer{text-align:center;padding:14px;font-size:13px;color:#6b655e}
    .footer a{color:#273f7c}
    @media(max-width:600px){#flipbook{height:70vh;min-height:350px}.header{padding-top:12px}}
  </style>
</head>
<body>
  <header class="header"><h1>The Measure of Being</h1><p>Reflections on Reality, Choice, and Becoming</p></header>
  <main id="flipbook" aria-label="Interactive book preview"></main>
  <footer class="footer">A preview of <em>The Measure of Being</em></footer>

  <!-- Keep these legacy library versions together; do not replace with latest CDN versions. -->
  <script src="js/jquery.min.js"></script>
  <script src="js/html2canvas.min.js"></script>
  <script src="js/three.min.js"></script>
  <script src="js/pdf.min.js"></script>
  <script>
    window.PDFJS_LOCALE = {pdfJsWorker:'js/pdf.worker.js',pdfJsCMapUrl:'cmaps'};
  </script>
  <script src="src/3dflipbook.min.js"></script>
  <script>
    jQuery(function($){
      $('#flipbook').FlipBook({
        pdf:'src/book-preview.pdf',
        template:{
          html:'templates/default-book-view.html',
          styles:['css/black-book-view.css'],
          links:[{rel:'stylesheet',href:'css/font-awesome.min.css'}],
          script:'js/default-book-view.js',
          sounds:{startFlip:'sounds/start-flip.mp3',endFlip:'sounds/end-flip.mp3'}
        }
      });
    });
  </script>
</body>
</html>
